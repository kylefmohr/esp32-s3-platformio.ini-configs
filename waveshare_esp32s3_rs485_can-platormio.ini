[env:waveshare_esp32s3_rs485_can]
; https://www.waveshare.com/wiki/ESP32-S3-RS485-CAN
; Flash: 16MB QD, PSRAM: 8MB OT
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Pin Config for RS-485
  -DPIN_RS485_TX=17          ; RS485 UART TXD
  -DPIN_RS485_RX=18          ; RS485 UART RXD
  -DPIN_RS485_DR=21          ; RS485 direction control (SP3485 DE/RE tied together)
  ; Pin Config for CAN
  -DPIN_CAN_TX=15            ; CAN (TWAI) TX
  -DPIN_CAN_RX=16            ; CAN (TWAI) RX
  ; Pin Config for onboard PCF85063 RTC
  -DPIN_I2C_SCL=38
  -DPIN_I2C_SDA=39